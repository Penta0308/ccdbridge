modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Penta0308/ccdbridge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
#updateJSONURL="https://change.me.example.invalid/updates.json"
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/"
#logoFile="ccdbridge.png"
#credits="Thanks for this example mod goes to Java"
authors="${mod_authors}" #optional
displayTest="MATCH_VERSION"
description='''${mod_description}'''

[[dependencies."${mod_id}"]]
   modId="forge"
   mandatory=true
   versionRange="${forge_version_range}"
   ordering="NONE"
   side="BOTH"

[[dependencies."${mod_id}"]]
   modId="minecraft"
   mandatory=true
    versionRange="${minecraft_version_range}"
   ordering="NONE"
   side="BOTH"

[[dependencies."${mod_id}"]]
modId="create"
mandatory=true
versionRange="[${create_version_production},${create_version_production_next})"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="destroy"
mandatory=true
versionRange="[${destroy_version},)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="cccbridge"
mandatory=true
versionRange="[${cccbridge_version},)"
ordering="NONE"
side="BOTH"


[[dependencies."${mod_id}"]]
modId="computercraft"
mandatory=true
versionRange="[${cc_version},)"
ordering="NONE"
side="BOTH"
